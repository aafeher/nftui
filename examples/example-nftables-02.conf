#!/usr/sbin/nft -f
# =====================================================================
# Példa és sablon egy teljes nftables konfigurációhoz
# Gentoo / systemd / OpenRC kompatibilis
# =====================================================================

# -------------------------------------------------
# 1️⃣  Tábla definiálása (family + név)
# -------------------------------------------------
# Family lehet: ip, ip6, inet, arp, bridge, netdev
# Az 'inet' család előnye: IPv4 és IPv6 együtt kezelhető

table inet firewall {

    # -------------------------------------------------
    # 2️⃣  Halmaz (set) példa
    # -------------------------------------------------
    # Használható portok, IP-k, hálózatok vagy bármi más tárolására
    set allowed_tcp_ports {
        type inet_service;             # port típus
        flags interval;                # tartományok is megengedettek
        elements = { 22, 80, 443, 8080 }
    }

    set trusted_hosts {
        type ipv4_addr;                # IPv4 címek halmaza
        elements = { 192.168.0.0/24, 10.0.0.5 }
    }

    # -------------------------------------------------
    # 3️⃣  Map (kulcs-érték leképezés) példa
    # -------------------------------------------------
    # Map segítségével pl. különböző interfészekhez más NAT művelet
    map iface_to_net {
        type ifname : ipv4_addr;
        elements = { "eth0" : 1.2.3.4, "ppp0" : 5.6.7.8 }
    }

    # -------------------------------------------------
    # 4️⃣  Input lánc (bejövő forgalom)
    # -------------------------------------------------
    chain input {
        type filter hook input priority 0;   # A rendszerbe érkező csomagok
        policy drop;                         # Alapértelmezett: dobás

        # Loopback interfész mindig engedélyezett
        iif "lo" accept

        # Kapcsolatkövetés — meglévő kapcsolatok engedése
        ct state established,related accept

        # Saját hálózatból érkező hostok engedése
        ip saddr @trusted_hosts accept

        # Engedélyezett portok TCP-n
        tcp dport @allowed_tcp_ports accept

        # ICMP / ping engedélyezése (IPv4 és IPv6)
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Naplózás + számlálás is lehetséges
        counter log prefix "drop_in: " drop
    }

    # -------------------------------------------------
    # 5️⃣  Forward lánc (átmenő forgalom)
    # -------------------------------------------------
    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }

    # -------------------------------------------------
    # 6️⃣  Output lánc (kimenő forgalom)
    # -------------------------------------------------
    chain output {
        type filter hook output priority 0;
        policy accept;   # alapból engedélyezve
    }
}

# =====================================================================
# NAT tábla (külön táblában)
# =====================================================================
table ip nat {

    # NAT előtti lánc (ritkán kell)
    chain prerouting {
        type nat hook prerouting priority 0;
    }

    # NAT utáni lánc (tipikus hely a masquerade-nek)
    chain postrouting {
        type nat hook postrouting priority 100;
        oifname "eth0" masquerade
    }
}

# =====================================================================
# LOG tábla — opcionális, ha külön logolást akarsz
# =====================================================================
table inet logtable {
    chain loginput {
        type filter hook input priority 10;
        log prefix "LOG: "
        accept
    }
}

# =====================================================================
# Hasznos megjegyzések:
# - A 'priority' érték határozza meg, hogy a lánc milyen sorrendben fut a kernelben.
# - A 'policy' az alapértelmezett viselkedés (accept/drop).
# - A 'counter' a számlálást engedélyezi a szabályon.
# - A '@setnév' szintaxis egy halmazra való hivatkozás.
# =====================================================================
