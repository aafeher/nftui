#!/usr/sbin/nft -f
# =====================================================================
# Example and template for a full nftables configuration
# Gentoo / systemd / OpenRC compatible
# =====================================================================

# -------------------------------------------------
# 1.  Table definition (family + name)
# -------------------------------------------------
# Family options: ip, ip6, inet, arp, bridge, netdev
# The 'inet' family covers both IPv4 and IPv6 in one table.

table inet firewall {

    # -------------------------------------------------
    # 2.  Set example
    # -------------------------------------------------
    # Usable for ports, IPs, networks, or any element type.
    set allowed_tcp_ports {
        type inet_service;             # port type
        flags interval;                # ranges are allowed
        elements = { 22, 80, 443, 8080 }
    }

    set trusted_hosts {
        type ipv4_addr;                # set of IPv4 addresses
        elements = { 192.168.0.0/24, 10.0.0.5 }
    }

    # -------------------------------------------------
    # 3.  Map (key-value mapping) example
    # -------------------------------------------------
    # Maps let you dispatch (e.g.) per-interface NAT actions.
    map iface_to_net {
        type ifname : ipv4_addr;
        elements = { "eth0" : 1.2.3.4, "ppp0" : 5.6.7.8 }
    }

    # -------------------------------------------------
    # 4.  Input chain (incoming traffic)
    # -------------------------------------------------
    chain input {
        type filter hook input priority 0;   # packets entering the system
        policy drop;                         # default: drop

        # Loopback interface is always allowed.
        iif "lo" accept

        # Connection tracking — allow established conns.
        ct state established,related accept

        # Hosts from trusted networks.
        ip saddr @trusted_hosts accept

        # Allowed TCP ports.
        tcp dport @allowed_tcp_ports accept

        # ICMP / ping (IPv4 and IPv6).
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept

        # Logging + counting are both available.
        counter log prefix "drop_in: " drop
    }

    # -------------------------------------------------
    # 5.  Forward chain (transit traffic)
    # -------------------------------------------------
    chain forward {
        type filter hook forward priority 0;
        policy drop;
    }

    # -------------------------------------------------
    # 6.  Output chain (outgoing traffic)
    # -------------------------------------------------
    chain output {
        type filter hook output priority 0;
        policy accept;   # allowed by default
    }
}

# =====================================================================
# NAT table (in a separate table)
# =====================================================================
table ip nat {

    # Pre-NAT chain (rarely needed)
    chain prerouting {
        type nat hook prerouting priority 0;
    }

    # Post-NAT chain (typical place for masquerade)
    chain postrouting {
        type nat hook postrouting priority 100;
        oifname "eth0" masquerade
    }
}

# =====================================================================
# LOG table — optional, when separate logging is desired
# =====================================================================
table inet logtable {
    chain loginput {
        type filter hook input priority 10;
        log prefix "LOG: "
        accept
    }
}

# =====================================================================
# Useful notes:
# - 'priority' determines the order in which the chain runs in the kernel.
# - 'policy' is the default verdict (accept/drop).
# - 'counter' enables packet/byte counting on the rule.
# - '@setname' syntax references a named set.
# =====================================================================
