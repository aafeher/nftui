#!/usr/sbin/nft -f
#
# =============================================================================
# HARDENED SINGLE-HOST FIREWALL (not a router)
# =============================================================================
# A real-world, good-practice host firewall:
#   - inbound: default-deny; only SSH (22), HTTP (80) and HTTPS (443) are open
#   - outbound: unrestricted (allow all)
#   - forwarding: denied — this host is NOT a gateway, so transit is dropped
#
# Good practices applied:
#   - single `inet` table so one rule set covers both IPv4 and IPv6
#   - stateful filtering: accept established/related early, drop invalid
#   - loopback trusted, plus anti-spoofing of loopback addresses from the wire
#   - ICMPv6 NDP is explicitly allowed (IPv6 breaks without it); ping is
#     rate-limited on both families
#   - SSH new connections are rate-limited to blunt brute-force attempts
#   - exposed services are kept in a named set for easy review/maintenance
#   - dropped inbound traffic is counted and a sample is logged
#   - named priorities (`filter`) and explicit chain policies
#
# Load (REPLACES the current ruleset — use on a host where that is OK):
#   sudo nft -f examples/example-host-firewall.conf
# Syntax-check only, without applying:
#   sudo nft -c -f examples/example-host-firewall.conf
# =============================================================================

# Start from a clean slate so the file is self-contained and idempotent.
flush ruleset

table inet firewall {

    # -------------------------------------------------------------------------
    # Exposed inbound TCP services, kept in one place for easy maintenance.
    # SSH is intentionally NOT in this set — it gets its own rate-limited rule
    # below (a blanket accept here would defeat the rate limit).
    # -------------------------------------------------------------------------
    set web_services {
        type inet_service
        elements = { 80, 443 }
    }

    # -------------------------------------------------------------------------
    # INPUT — traffic destined for this host. Default policy: drop.
    # -------------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        # 1. Stateful fast path: established/related is already vetted; invalid
        #    packets never belong to a valid flow, so drop them outright.
        ct state established,related counter accept comment "established/related"
        ct state invalid counter drop comment "invalid conntrack state"

        # 2. Loopback is always trusted. Block packets arriving from the wire
        #    that claim a loopback destination (a classic spoofing vector).
        iif lo accept comment "loopback"
        iif != lo ip daddr 127.0.0.0/8 counter drop comment "anti-spoof: v4 loopback"
        iif != lo ip6 daddr ::1 counter drop comment "anti-spoof: v6 loopback"

        # 3. ICMPv6 is mandatory for IPv6 to function (neighbour/router
        #    discovery, PMTU). Accept the essential types unconditionally.
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-solicit, nd-router-advert, destination-unreachable, packet-too-big, time-exceeded, parameter-problem } accept comment "icmpv6 essentials (NDP/PMTU)"

        # 4. Ping, rate-limited on both families to soften flood attempts.
        icmpv6 type echo-request limit rate 10/second accept comment "icmpv6 echo (ping)"
        ip protocol icmp icmp type echo-request limit rate 10/second accept comment "icmp echo (ping)"

        # 5. Exposed services.
        #    SSH: rate-limit NEW connections to slow brute-force scanning.
        tcp dport 22 ct state new limit rate 15/minute burst 5 packets counter accept comment "ssh (rate-limited)"
        #    Web: HTTP/HTTPS new connections.
        tcp dport @web_services ct state new counter accept comment "http/https"

        # 6. Everything else is dropped by the chain policy. Count all of it and
        #    log a rate-limited sample for visibility (avoids log flooding).
        counter comment "count all dropped inbound"
        limit rate 5/minute burst 5 packets log prefix "nft-drop-in: " level info comment "log dropped (sampled)"
    }

    # -------------------------------------------------------------------------
    # FORWARD — transit traffic. This host is not a gateway, so deny all.
    # -------------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;
        counter comment "count dropped forward (host is not a router)"
    }

    # -------------------------------------------------------------------------
    # OUTPUT — traffic originating from this host. Allow all (per requirement).
    # -------------------------------------------------------------------------
    chain output {
        type filter hook output priority filter; policy accept;
        # Outbound is unrestricted by design; nothing to filter here.
    }
}
