# KONFIGURÁCIÓ VÉGE
# =============================================================================
#
# HASZNÁLATI UTASÍTÁSOK:
#
# 1. MODULOK BETÖLTÉSE (ha szükséges):
#    sudo modprobe nf_conntrack
#    sudo modprobe nf_conntrack_ipv4
#    sudo modprobe nf_conntrack_ipv6
#    sudo modprobe nft_counter
#    sudo modprobe nft_limit
#    sudo modprobe nft_connlimit   (ct count szabályokhoz)
#
# 2. KONFIGURÁCIÓ ALKALMAZÁSA:
#    sudo nft -c -f example-nftables-01.conf  # szintaxis ellenőrzés
#    sudo nft -f example-nftables-01.conf     # alkalmazás
#
# 3. ELLENŐRZÉS ÉS MONITORING:
#    sudo nft list ruleset                    # összes szabály
#    sudo nft list counters                   # számlálók
#    sudo nft list table ip filter -n -n     # részletes info
#    sudo nft monitor                         # élő figyelés
#
# 4. TISZTÍTÁS:
#    sudo nft flush ruleset                   # minden szabály törlése
#
# 5. CONNECTION TRACKING AKTIVÁLÁSA:
#    # Ha működik a CT, akkor aktiváld a kommentezett CT szabályokat
#    # Cseréld le a # jellel kezdődő ct state szabályokat
#
# 6. HIBAKERESÉS:
#    # Rule tracing aktiválása:
#    sudo nft add rule ip filter input tcp dport 22 meta nftrace set 1
#    # Trace figyelése:
#    sudo nft monitor trace
#
# =============================================================================
