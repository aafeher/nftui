# Goreleaser config for nftui — reproducible Linux amd64 / arm64 binaries.
#
# Triggered from .github/workflows/release.yml on a `v*` tag push. Local
# validation:
#
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish
#
# The snapshot variant builds everything under ./dist/ without touching GitHub
# so the config can be exercised against any working tree.
#
# Reproducibility:
#   - CGO_ENABLED=0      static binary, no glibc dependency
#   - -trimpath          strips local filesystem paths from the binary
#   - -s -w              drops the symbol table and DWARF debug info
#   - mod_timestamp      pins the binary's embedded mtime to the commit time,
#                        so two builds of the same tag produce byte-identical
#                        binaries (given the same Go toolchain version).

version: 2

project_name: nftui

# Pre-build hooks. `go mod verify` is read-only (asserts go.sum checksums
# against module cache) so it can NEVER mutate go.mod / go.sum during a
# release — preserves the "byte-identical given the same toolchain" promise.
# Avoid `go mod tidy` here; it can rewrite go.sum mid-release and silently
# diverge the published binary from the committed source state.
before:
  hooks:
    - go mod verify

builds:
  - id: nftui
    main: .
    binary: nftui
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: nftui
    ids:
      - nftui
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - man/nftui.1

# Debian / RPM packages (nfpm, v1.0.0 item V-2). Built from the same `nftui`
# build as the archives, so the deb/rpm binary is byte-for-byte the archive's.
# nfpm builds both formats in pure Go (no rpmbuild/dpkg-dev needed), and the
# packages are folded into checksums.txt automatically — so the existing cosign
# signature over the checksum file covers them too, no extra signing config.
nfpms:
  - id: nftui
    package_name: nftui
    ids:
      - nftui
    formats:
      - deb
      - rpm
      - apk
      - archlinux
      - ipk
    maintainer: "Ákos Fehér <aafeher@users.noreply.github.com>"
    homepage: "https://github.com/aafeher/nftui"
    description: "Terminal user interface for managing the Linux nftables firewall."
    license: MIT
    section: net
    # nftui shells out to nft(8) for `--config` load and table/chain rename, so
    # the nftables package is a hard runtime dependency (same package name on
    # Debian/Ubuntu and Fedora/RHEL).
    dependencies:
      - nftables
    # The binary lands in /usr/bin automatically (nfpm default bindir). Ship the
    # man page on the standard path and the docs under /usr/share/doc/nftui.
    contents:
      - src: ./man/nftui.1
        dst: /usr/share/man/man1/nftui.1
        file_info:
          mode: 0644
      - src: ./LICENSE
        dst: /usr/share/doc/nftui/LICENSE
        file_info:
          mode: 0644
      - src: ./README.md
        dst: /usr/share/doc/nftui/README.md
        file_info:
          mode: 0644
      - src: ./CHANGELOG.md
        dst: /usr/share/doc/nftui/CHANGELOG.md
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Supply-chain attestation (audit E-6). Three layers, all consumable with
# standard tooling:
#   - sboms:  a Syft SPDX SBOM per archive, so downstreams can inventory what
#             ships. Requires `syft` on PATH (the release workflow installs it).
#   - signs:  keyless cosign signature over checksums.txt. Signing the checksum
#             file (not each artifact) is the canonical, cheap pattern: verify
#             the signature once, then verify any artifact against the trusted
#             checksums. Keyless uses the workflow's OIDC identity via Fulcio /
#             Rekor — no long-lived private key to store. Requires `cosign` on
#             PATH and `id-token: write` in the workflow.
# SLSA build provenance is attested separately in release.yml via
# actions/attest-build-provenance (GitHub-native, not a Goreleaser feature).
sboms:
  - id: archive
    artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    certificate: "${artifact}.pem"
    signature: "${artifact}.sig"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# This block only applies when no --release-notes file is passed — i.e. a
# manual `goreleaser release` outside the workflow. The tag workflow in
# .github/workflows/release.yml ALWAYS passes --release-notes (the curated
# CHANGELOG.md section), which bypasses Goreleaser's changelog generation
# entirely. The CHANGELOG.md bundled in each archive comes from `files:`
# above, not from here. Kept as a sane fallback for manual runs.
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"
      - "^ci:"

release:
  # `release.github.{owner,name}` intentionally omitted — Goreleaser auto-
  # detects them from the git remote at release time. Hardcoding the upstream
  # repo would make forks unable to release from their own tags.
  draft: false
  # `auto` marks the release as pre-release when the tag is `vX.Y.Z-something`
  # (rc / beta / alpha). Plain `vX.Y.Z` tags publish as stable releases.
  prerelease: auto
  mode: append
  name_template: "{{ .ProjectName }} {{ .Tag }}"
