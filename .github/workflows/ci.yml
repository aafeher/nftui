# CI pipeline. Five stages:
#
#   1. build-and-test — gofmt, go vet (default + integration tag), go build,
#      go test -race ./... with a coverage profile uploaded to Codecov (flag
#      "unit"). Runs on every push / PR; fast, no privileges.
#   2. integration-test — sudo -E go test -tags=integration ./nft/ -v after
#      installing the nftables package. Needs CAP_NET_ADMIN (provided by sudo)
#      because the harness applies / reads back a live ruleset. Writes a
#      coverage profile (-coverpkg=./nft/...), prints the total, and uploads it
#      to Codecov (flag "integration"), so the live netlink path's coverage —
#      invisible to the unit profile — stays observable in the job log and on
#      Codecov.
#   3. govulncheck — scans the module + stdlib against the Go vulnerability DB
#      (audit E-7). Independent of build-and-test so a CVE surfaces as its own
#      check; fails only on a vulnerability reachable from nftui's own call
#      graph. Paired with .github/dependabot.yml, which opens dependency- and
#      action-update PRs.
#   4. reproducibility — builds the release binaries twice with
#      `goreleaser build --snapshot` and fails if the two differ, proving the
#      mod_timestamp + -trimpath + CGO-free build is byte-reproducible (v1.0.0
#      item V-4). Gated on build-and-test so it skips a commit that doesn't even
#      compile.
#   5. nix — builds the flake end-to-end on a Nix host (`nix flake check` +
#      `nix build .#default`), closing the v0.9.0 gap that flake.nix was only
#      hand-validated, never built (v1.0.0 item V-5). Gated on build-and-test.
#      NOTE: the first run fails on flake.nix's `vendorHash = fakeHash` and
#      prints the real `sha256-...` to pin — a one-time bootstrap.
#
# Concurrency cancels superseded runs on the same ref so a rapid push doesn't
# queue redundant jobs.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & unit tests
    runs-on: ubuntu-latest
    # Tight cap: fmt/vet/build/test for a small Go module finishes in 2-3 min
    # on GH runners. 15 min gives ample headroom while still failing fast if
    # something hangs (e.g. a runaway race-detector goroutine).
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt found unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet ./...
          go vet -tags=integration ./...

      - name: Build
        run: go build ./...

      - name: Unit tests
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      # Upload the unit coverage profile to Codecov (flagged "unit" so it can be
      # tracked separately from the integration profile). Uses CODECOV_TOKEN
      # (repo secret); a missing token or transient upload error is non-fatal so
      # coverage reporting never blocks the build gate.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          flags: unit
          fail_ci_if_error: false

  integration-test:
    name: Integration tests (CAP_NET_ADMIN)
    runs-on: ubuntu-latest
    needs: build-and-test
    # Slightly higher than unit because apt-installing nftables + the netlink
    # roundtrip adds startup time. A hung `nft -f` or `nft delete table`
    # against the runner kernel would otherwise eat the default 6 h.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install nftables
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
          nft --version

      # sudo strips PATH by default, so the Go toolchain that setup-go added
      # is invisible to the elevated process. `sudo -E env PATH=$PATH` forwards
      # the current PATH (and other env) so `go` resolves under root.
      #
      # -coverprofile makes the live netlink path's coverage observable: the
      # unit-test profile can't see it (those tests run unprivileged, without
      # the integration build tag), so this is the only place the numbers
      # exist. -coverpkg widens attribution to the whole nft tree so helper
      # packages the harness exercises indirectly are counted too.
      - name: Integration tests
        run: sudo -E env "PATH=$PATH" go test -tags=integration -coverprofile=integration-cover.out -coverpkg=./nft/... -v ./nft/

      - name: Integration coverage summary
        run: go tool cover -func=integration-cover.out | tail -1

      # The profile is written by the sudo'd test process; make it readable by
      # the runner user before the uploader picks it up.
      - name: Make integration coverage readable
        run: sudo chmod 0644 integration-cover.out

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: integration-cover.out
          flags: integration
          fail_ci_if_error: false

  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-latest
    # Independent of build-and-test (own check, runs in parallel) and not a
    # gate for the integration job. govulncheck's default symbol-level analysis
    # fails the run only when a known vulnerability is actually reachable from
    # nftui's call graph — informational findings in unused dependency code do
    # not break the build.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  reproducibility:
    name: Reproducible build check
    runs-on: ubuntu-latest
    needs: build-and-test
    # Two full cross-arch builds plus the GoReleaser install. Comfortably under
    # this cap; the headroom guards against a hung build.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          install-only: true
          version: "~> v2"

      # Build the release binaries twice and compare their SHA-256 sums. The
      # snapshot version derives from the last tag (no timestamp), so it is
      # identical across both runs; combined with mod_timestamp / -trimpath /
      # CGO_ENABLED=0 the binaries must come out byte-for-byte identical. Only
      # the compiled binaries are compared — archive / package containers carry
      # their own metadata and are out of scope for this check.
      - name: Build twice and compare
        run: |
          set -euo pipefail
          goreleaser build --snapshot --clean
          sha256sum $(find dist -type f -name nftui | sort) | awk '{print $1}' > /tmp/repro-1
          goreleaser build --snapshot --clean
          sha256sum $(find dist -type f -name nftui | sort) | awk '{print $1}' > /tmp/repro-2
          echo "First build:";  cat /tmp/repro-1
          echo "Second build:"; cat /tmp/repro-2
          if ! diff -u /tmp/repro-1 /tmp/repro-2; then
            echo "::error::build is not reproducible — binaries differ between two builds"
            exit 1
          fi
          echo "OK: both builds produced byte-identical binaries."

  nix:
    name: Nix flake build
    runs-on: ubuntu-latest
    needs: build-and-test
    # A from-scratch Nix build (fetch nixpkgs + compile the Go module with
    # doCheck=true) is the slowest lane; the headroom covers a cold cache.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # `nix flake check` evaluates every output (packages, apps, devShell,
      # checks) and builds the checks — i.e. it compiles nftui and runs its unit
      # suite (doCheck) inside the sandbox. `nix build` then materializes the
      # default package explicitly.
      #
      # First-run bootstrap: flake.nix ships `vendorHash = lib.fakeHash`, so the
      # first build here FAILS and prints the real `sha256-...`. Paste it into
      # flake.nix's vendorHash line and re-push; the lane then goes green and
      # guards the hash against go.sum drift.
      - name: nix flake check
        run: nix flake check -L

      - name: nix build
        run: nix build .#default -L
