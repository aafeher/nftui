# CodeQL — static analysis (SAST) for the Go code.
#
# Runs GitHub's CodeQL engine over the module and uploads findings to the
# code-scanning (Security) tab. Complements the govulncheck job in ci.yml:
# govulncheck flags known-vulnerable dependency calls, CodeQL flags bug /
# security patterns in nftui's own source. Closes the OpenSSF Scorecard SAST
# finding.
#
# Go uses the "autobuild" mode (CodeQL builds the module to trace it). Go is set
# up from go.mod before the init step so autobuild uses the project toolchain.
#
# All `github/codeql-action/*` steps MUST stay on the same release. A mixed set
# (e.g. init on v4.36.2, autobuild on v4.37.8) aborts the job with "Loaded a
# configuration file for version 'X', but running version 'Y'" — reported as a
# CodeQL *configuration error*, not as a code finding. Dependabot proposes one
# sub-action per PR, so .github/dependabot.yml groups `github/codeql-action*`
# into a single PR; when pinning by hand, move all three below **and**
# scorecard.yml's `upload-sarif` in the same commit.

name: CodeQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '30 7 * * 2'

# Read-only at the workflow level; the analysis job elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Upload the analysis results to the code-scanning (Security) tab.
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Install the go.mod toolchain before init so CodeQL's autobuild uses it.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:go"
