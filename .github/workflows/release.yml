# Release pipeline: on every `v*` tag push, build reproducible Linux amd64 /
# arm64 binaries via Goreleaser, publish them as a GitHub release, and use the
# matching CHANGELOG.md section as the release notes.
#
# The user controls the tag — this workflow only fires after `git push --tags`.
# CHANGELOG.md must already have the [X.Y.Z] section promoted from
# [Unreleased] for the matching tag; if no section is found, the workflow
# falls back to a placeholder pointing at the CHANGELOG link.

name: Release

on:
  push:
    tags:
      - 'v*'

# Default to read-only at the workflow level; the single release job below
# elevates only the write scopes it needs. Keeping write off the top level is
# the minimal-token-permissions posture (OpenSSF Scorecard checks for this).
permissions:
  contents: read

jobs:
  goreleaser:
    name: Goreleaser
    runs-on: ubuntu-latest
    # Releases create artifacts and a GitHub Release object (contents: write).
    # Supply-chain attestation (audit E-6) needs two more scopes:
    #   - id-token: write      OIDC token for keyless cosign signing (Fulcio/Rekor)
    #                          and for the build-provenance attestation.
    #   - attestations: write  lets actions/attest-build-provenance record the
    #                          signed SLSA provenance for the built artifacts.
    permissions:
      contents: write
      id-token: write
      attestations: write
    # 30 min is generous for a 2-arch Go static build; a stalled goreleaser
    # invocation will fail fast instead of pinning a runner for the default
    # six hours.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Goreleaser's changelog generation walks history from the previous
          # tag; without full history it can only see the tagged commit.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      # Supply-chain tooling Goreleaser shells out to (audit E-6): cosign for
      # the keyless checksum signature, syft for the per-archive SBOM. Both
      # must be on PATH before `goreleaser release` runs.
      #
      # Pinned to cosign-installer v3 on purpose: v4 installs cosign 4.x, whose
      # `sign-blob` defaults broke this Goreleaser `signs:` block at the v1.1.0
      # tag ("create bundle file: open : no such file or directory"). v3 (cosign
      # v2.x) is the last version Goreleaser ~> v2 signs cleanly. Dependabot is
      # told to leave this action alone (.github/dependabot.yml); revisit when
      # Goreleaser's signs block is made cosign-4 compatible.
      - name: Install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      # Pull the [X.Y.Z] section from CHANGELOG.md so the GitHub release body
      # is the curated text, not the auto-generated commit list. The matcher
      # uses awk's `index()` (literal substring), NOT a regex — so a version
      # like `1.0.0` is matched as the literal four characters, never as a
      # regex where `.` would also match `X`. Captures everything between the
      # matching header and the next `## [` header. Empty result → write a
      # placeholder so Goreleaser still has something to publish.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          header="## [${ver}]"
          notes_file="$(mktemp)"
          awk -v header="$header" '
            index($0, header) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$notes_file"
          if [ ! -s "$notes_file" ]; then
            echo "::warning::No CHANGELOG.md section for ${ver} — using placeholder body"
            cat > "$notes_file" <<EOF
          See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md) for curated release notes.
          EOF
          fi
          echo "path=$notes_file" >> "$GITHUB_OUTPUT"
          echo "--- release notes preview ---"
          cat "$notes_file"

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          # Track the v2 major series — pulls the latest v2.x at run time but
          # is immune to a v3 breaking-change shipping silently on release
          # day. The v0.9.0 config was verified locally against v2.16.0
          # (current-schema fields: archives.formats / archives.ids).
          version: "~> v2"
          args: release --clean --release-notes=${{ steps.notes.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Go module dependency tarball for offline source builds (v1.0.0 item
      # V-7) — chiefly the from-source Gentoo ebuild, whose go-module.eclass
      # forbids network access during the build. The archive is reproducible
      # (deterministic tar + single-threaded xz, mtime pinned to the tagged
      # commit) and its contents are content-addressed by go.sum. Goreleaser
      # doesn't track it (and checksums.txt is already cosign-signed by now), so
      # it's generated here and uploaded to the release Goreleaser just created;
      # the attestation step below then covers it with SLSA provenance.
      - name: Attach Go module dependency tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          epoch="$(git log -1 --format=%ct)"
          out="dist/nftui-${GITHUB_REF_NAME#v}-deps.tar.xz"
          bash scripts/gen-deps-tarball.sh "$out" "$epoch"
          gh release upload "${GITHUB_REF_NAME}" "$out" --clobber

      # SLSA build provenance for the published archives + checksums (audit
      # E-6). GitHub-native attestation: signs a provenance statement with the
      # workflow's OIDC identity and records it so `gh attestation verify` (or
      # cosign) can later prove these bytes were built by this workflow from
      # this repo. Runs after Goreleaser has populated ./dist/.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt
            dist/nftui-*-deps.tar.xz
